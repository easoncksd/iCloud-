[Service]
Environment=PICKUP_BASE_URL=https://mail.fangao.fun
Environment=PICKUP_WORKERS=4
EnvironmentFile=/root/.icloud-hme-admin-env
Restart=always
RestartSec=3
TimeoutStopSec=40
LimitNOFILE=65536
TasksMax=512
# Leave headroom for IMAP parsing and cache writes on the 2 GB server.
MemoryHigh=640M
MemoryMax=768M
CapabilityBoundingSet=
AmbientCapabilities=
LockPersonality=true
ProtectClock=true
RestrictRealtime=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
