[Service]
Environment=PICKUP_BASE_URL=https://mail.fangao.fun
EnvironmentFile=/root/.icloud-hme-admin-env
Restart=always
RestartSec=3
TimeoutStopSec=20
LimitNOFILE=65536
TasksMax=512
