server {
    listen 80;
    server_name mail.fangao.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail.fangao.fun;

    ssl_certificate /etc/letsencrypt/live/mail.fangao.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.fangao.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ICLOUDSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    limit_req_status 429;
    limit_req_log_level warn;
    access_log /www/wwwlogs/icloud-mail-access.log icloud_redacted;
    error_log /www/wwwlogs/icloud-mail-error.log warn;

    if ($request_method = TRACE) { return 405; }

    location = /healthz {
        return 404;
    }

    location ^~ /pickup/ {
        limit_req zone=icloud_pickup_rate burst=2500 nodelay;
        limit_conn perip 1200;
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering on;
        proxy_cache off;

        include /www/server/nginx/conf/icloud-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /api/log-stream {
        limit_req zone=icloud_admin_rate burst=100 nodelay;
        limit_conn perip 50;

        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        include /www/server/nginx/conf/icloud-security-headers.conf;
        add_header X-Accel-Buffering no;
    }

    location / {
        limit_req zone=icloud_admin_rate burst=100 nodelay;
        limit_conn perip 50;

        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        include /www/server/nginx/conf/icloud-security-headers.conf;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name 64.90.3.18;
    return 301 https://mail.fangao.fun$request_uri;
}
