map $uri $icloud_log_uri {
    default $uri;
    ~^/pickup/ /pickup/[redacted];
}

log_format icloud_redacted '$remote_addr - $remote_user [$time_local] '
    '"$request_method $icloud_log_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=icloud_pickup_rate:10m rate=500r/s;
limit_req_zone $binary_remote_addr zone=icloud_admin_rate:10m rate=20r/s;
